## ------------------------------------------- Mock ID Integration properties ------------------------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin

## ------------------------------------------- Mock ID plugin related properties ------------------------------------------------------------
mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
mosip.certify.mock.authenticator.get-identity-url=http://mock-identity-system:8082/v1/mock-identity-system/identity
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.identifier=http://localhost:8091

#to be updated to GitHub pages url when one is running locally, otherwise it can be replaced with the certify service did url
mosip.certify.data-provider-plugin.issuer-public-key-uri=did:web:marshmelloweranda.github.io:DID:dev1#key-0
mosip.certify.data-provider-plugin.issuer-uri=did:web:marshmelloweranda.github.io:DID:dev1

mosip.certify.plugin-mode=DataProvider
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.data-provider-plugin.issuer.vc-sign-algo=Ed25519Signature2020
# mosip.certify.data-provider-plugin.db.url=jdbc:postgresql://postgres:5432/mosip_certify

# For Docker to access host machine's localhost
#mosip.certify.data-provider-plugin.backend.endpoint-url=http://host.docker.internal:8888/api/drivinglicence-application

# mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
#     'mock_identity_vc_ldp': 'SELECT id, sub, application_id, medical_certificate_id, full_name, email, phone, date_of_birth, gender, blood_group, doctor_name, hospital, issued_date, expiry_date, is_fit_to_drive, vision, hearing, remarks, photo_url, written_test, practical_test, selected_categories, total_amount, payment_reference_id, payment_transaction_id, status, created_at, updated_at FROM certify.applications WHERE id = :id'\
#   }

mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
    'mock_identity_vc_ldp': 'select sub_id,application_number,service_type,nic_number,full_name,birth_date,gender,mobile_number,email_address,district,status from certify.passport_applications where sub_id=:id'\
  }

## CSV specific config
mosip.certify.mock.data-provider.csv.identifier-column=id
mosip.certify.mock.data-provider.csv.data-columns=id,fullName,mobileNumber,dateOfBirth,gender,state,district,villageOrTown,postalCode,landArea,landOwnershipType,primaryCropType,secondaryCropType,face,farmerID
mosip.certify.mock.data-provider.csv-registry-uri=/home/mosip/config/farmer_identity_data.csv
mosip.certify.data-provider-plugin.rendering-template-id=


mosip.certify.key-values={\
  'latest' : {\
              'credential_issuer': '${mosip.certify.identifier}',   \
              'authorization_servers': {'${mosip.certify.authorization.url}'}, \
              'credential_endpoint': '${mosipbox.public.url}${server.servlet.path}/issuance/credential', \
              'display': {{'name': 'Department of Motor Traffic', 'locale': 'en'}},\
              'credential_configurations_supported' : { \
                 'DrivingLicenseCredential' : {\
                    'format': 'ldp_vc',\
                    'scope' : 'mock_identity_vc_ldp',\
                    'cryptographic_binding_methods_supported': {'did:jwk'},\
                    'credential_signing_alg_values_supported': {'Ed25519Signature2020'},\
                    'proof_types_supported': {'jwt': {'proof_signing_alg_values_supported': {'RS256', 'PS256'}}},\
                    'credential_definition': {\
                    'type': {'VerifiableCredential','DrivingLicenseCredential'},\
                    'context': {'https://www.w3.org/2018/credentials/v1'},\
                      'credentialSubject': {\
                            'sub_id': {'display': {{'name': 'Subject ID','locale': 'en'}}}, \
                            'application_number': {'display': {{'name': 'Application Number','locale': 'en'}}},\
                            'service_type': {'display': {{'name': 'Service Type','locale': 'en'}}},\
                            'nic_number': {'display': {{'name': 'NIC Number','locale': 'en'}}},\
                            'full_name': {'display': {{'name': 'Full Name','locale': 'en'}}},\
                            'birth_date': {'display': {{'name': 'Date of Birth','locale': 'en'}}},\
                            'gender': {'display': {{'name': 'Gender','locale': 'en'}}},\
                            'mobile_number': {'display': {{'name': 'Mobile Number','locale': 'en'}}},\
                            'email_address': {'display': {{'name': 'Email Address','locale': 'en'}}},\
                            'district': {'display': {{'name': 'District','locale': 'en'}}},\
                            'status': {'display': {{'name': 'Application Status','locale': 'en'}}}\
                     }},\
                    'display': {{'name': 'Passport Application Verifiable Credential', \
                                  'locale': 'en', \
                                  'logo': {'url': 'https://github.com/marshmelloweranda/DMTLogo/blob/main/DMT.jpg','alt_text': 'Department of Motor Traffic Logo'},\
                                  'background_color': '#1e3a8a',\
                                  'background_image': { 'uri': 'https://github.com/marshmelloweranda/DMTLogo/blob/main/DMT.jpg' }, \
                                  'text_color': '#ffffff'}},\
                    'order' : {'sub_id','application_number','service_type','full_name','nic_number','birth_date','gender','mobile_number','email_address','district','status'}\
  }}}}





